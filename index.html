<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Katalog Produk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap">
<style>
:root{--bg:#eaf4ff;--ink:#1d1b3a;--pk:#ff3d71;--yl:#ffd23f;--tl:#12c2a8;--bl:#3b82f6;--card:#fff;--mut:#5b5876;--wa:#12b76a;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1080px;margin:0 auto;padding:14px}
:focus-visible{outline:3px solid var(--bl);outline-offset:2px}

.hero{position:relative;overflow:hidden;background:var(--pk);color:#fff;text-align:center;border:3px solid var(--ink);border-radius:28px;box-shadow:6px 6px 0 var(--ink);padding:30px 18px 24px;margin-bottom:18px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;border:3px solid var(--ink);z-index:0}
.hero::before{width:120px;height:120px;background:var(--yl);left:-36px;top:-40px}
.hero::after{width:90px;height:90px;background:var(--tl);right:-24px;bottom:-34px}
.hero>*{position:relative;z-index:1}
h1{margin:0;font-family:Fredoka,"Plus Jakarta Sans",system-ui,sans-serif;font-weight:700;font-size:clamp(2rem,7vw,3.3rem);line-height:1.1;text-shadow:3px 3px 0 var(--ink);overflow-wrap:anywhere}
.tag{margin:8px 0 18px;font-weight:600;font-size:1.05rem}
.search{max-width:520px;margin:0 auto}
input,select,textarea{width:100%;padding:11px 14px;border:2px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);font:inherit}
.search input{border-width:3px;border-radius:999px;padding:13px 20px;box-shadow:3px 3px 0 var(--ink);font-weight:600}
textarea{resize:vertical}

.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 4px 14px}
.chip{border:2px solid var(--ink);background:#fff;color:var(--ink);padding:7px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;font:inherit;font-weight:700;font-size:.92rem}
.chip.on{background:var(--yl);box-shadow:2px 2px 0 var(--ink)}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}}
.card{background:var(--card);border:2.5px solid var(--ink);border-radius:20px;box-shadow:4px 4px 0 var(--ink);overflow:hidden;display:flex;flex-direction:column}
.pic{position:relative;width:100%;aspect-ratio:5/4;border-bottom:2.5px solid var(--ink);background:#ffe27a;overflow:hidden}
.pbtn{position:absolute;inset:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:0;margin:0;border:0;background:transparent;cursor:zoom-in;font:inherit;font-size:3.2rem;color:inherit}
.card:nth-child(4n+2) .pic{background:#9ff0e1}
.card:nth-child(4n+3) .pic{background:#ffb3c7}
.card:nth-child(4n+4) .pic{background:#b8d4ff}
.pic img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
.pic:hover img{transform:scale(1.05)}
.card.out .pic img{filter:grayscale(1)}
.zoom{position:absolute;right:8px;bottom:8px;background:#fff;border:2px solid var(--ink);border-radius:999px;font-size:.72rem;font-weight:700;padding:2px 10px;color:var(--ink)}
.sold{position:absolute;left:8px;top:8px;background:var(--ink);color:#fff;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px}
.info{padding:12px 13px 13px;display:flex;flex-direction:column;gap:6px}
.name{font-weight:700;font-size:1rem;line-height:1.3;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.meta{display:flex;align-items:center;justify-content:space-between;gap:8px}
.price{font-family:Fredoka,"Plus Jakarta Sans",sans-serif;font-weight:700;color:var(--pk);font-size:1.2rem}
.wa{flex:none;width:44px;height:44px;border-radius:50%;background:var(--wa);border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);display:flex;align-items:center;justify-content:center;text-decoration:none}
.wa svg{width:21px;height:21px;fill:#fff}
.wa:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.wa.off{background:#e5e3ef;border-color:#c9c6dc;box-shadow:none;pointer-events:none}
.wa.off svg{fill:#9a97b3}
.cat{align-self:flex-start;background:#d6f7f0;color:#0a6b5b;font-size:.74rem;font-weight:700;padding:2px 10px;border-radius:999px}
.admrow{padding:0 13px 13px;display:flex;gap:8px}
.admrow .btn{flex:1;margin-top:0;padding:8px}

.btn{border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px;font:inherit;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;display:block;background:var(--wa);color:#fff;box-shadow:3px 3px 0 var(--ink);margin-top:6px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.off{background:#e5e3ef;color:var(--mut);box-shadow:none;border-color:#c9c6dc;pointer-events:none}
.btn.sec{background:#fff;color:var(--ink)}
.btn.pri{background:var(--pk);color:#fff}
.btn.del{background:#fff;color:#d3123f}
.row{display:flex;gap:8px}
.row .btn{flex:1}
.adm{background:var(--yl);border:2.5px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--ink);padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px;align-items:center}
.adm .btn{display:inline-block;margin-top:0;padding:8px 14px}
.empty{text-align:center;color:var(--mut);font-weight:600;padding:44px 0}
.err{text-align:center;color:#d3123f;font-weight:600;padding:30px 0}

dialog{border:3px solid var(--ink);border-radius:24px;background:#fff;color:var(--ink);box-shadow:6px 6px 0 var(--ink);width:min(470px,94vw);padding:20px;max-height:90vh}
dialog::backdrop{background:#1d1b3acc}
dialog label{display:block;font-size:.85rem;font-weight:700;margin:12px 0 5px}
dialog h2{margin:0 0 4px;font-family:Fredoka,"Plus Jakarta Sans",sans-serif;font-size:1.4rem}
.pv{width:96px;height:96px;object-fit:cover;border-radius:12px;border:2px solid var(--ink);margin-top:8px}
.pic.noimg .pbtn{cursor:default}
dialog#lb{width:100vw;height:100vh;max-width:none;max-height:none;margin:0;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none;overflow:hidden}
dialog#lb[open]{display:block}
dialog#lb::backdrop{background:#0a0a1fe6}
.lbwrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;cursor:zoom-out;touch-action:pan-y}
#lb img{max-width:92vw;max-height:82vh;object-fit:contain;display:block;border:3px solid #fff;border-radius:14px;background:#fff;cursor:default;user-select:none;-webkit-user-drag:none}
.lbx{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:44px;height:44px;border-radius:50%;border:2.5px solid var(--ink);background:var(--yl);color:var(--ink);font:inherit;font-size:1.2rem;font-weight:700;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.lbnav,.arr{display:flex;align-items:center;justify-content:center;border:2.5px solid var(--ink);background:#fff;color:var(--ink);font-weight:700;line-height:1;cursor:pointer;padding:0;border-radius:50%;position:absolute;top:50%;transform:translateY(-50%)}
.lbnav{width:48px;height:48px;font-size:1.9rem;box-shadow:2px 2px 0 var(--ink)}
.lbnav.l,.arr.l{left:10px}
.lbnav.r,.arr.r{right:10px}
.arr{width:32px;height:32px;font-size:1.3rem;border-width:2px;z-index:2}
.cnt{position:absolute;left:8px;bottom:8px;background:#fff;border:2px solid var(--ink);border-radius:999px;font-size:.72rem;font-weight:700;padding:1px 10px;z-index:2;color:var(--ink)}
.lbcnt{position:absolute;left:50%;top:calc(20px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#fff;border:2px solid var(--ink);border-radius:999px;padding:3px 14px;font-weight:700;font-size:.85rem;color:var(--ink)}
.lbdots{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;pointer-events:none}
.dot{width:11px;height:11px;border-radius:50%;background:#ffffff55;border:2px solid #fff}
.dot.on{background:var(--yl);border-color:var(--yl)}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.th{position:relative;width:84px;height:84px;border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .main{position:absolute;left:4px;top:4px;background:var(--yl);border:1.5px solid var(--ink);border-radius:999px;font-size:.62rem;font-weight:700;padding:0 6px}
.thb{position:absolute;right:3px;bottom:3px;display:flex;gap:3px}
.thb button{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink);background:#fff;font-size:.75rem;line-height:1;padding:0;cursor:pointer;color:var(--ink)}
.hint{font-size:.8rem;color:var(--mut);margin-top:6px}
.wrap{padding-bottom:100px}
.wa{position:relative;cursor:pointer;padding:0;color:#fff;font:inherit}
.qb{position:absolute;top:-9px;right:-9px;min-width:22px;height:22px;padding:0 5px;border-radius:999px;background:var(--yl);border:2px solid var(--ink);font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--ink)}
#cartbar{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:20}
.cbtn{pointer-events:auto;width:min(560px,100%);display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--pk);color:#fff;border:3px solid var(--ink);border-radius:999px;box-shadow:4px 4px 0 var(--ink);padding:12px 20px;font:inherit;font-weight:700;cursor:pointer}
.cb2{flex:1;text-align:center;font-family:Fredoka,"Plus Jakarta Sans",sans-serif;font-size:1.05rem}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
dialog#cd{width:min(560px,94vw)}
.crow{display:flex;gap:12px;padding:12px 0;border-bottom:2px dashed #cfcbe6}
.cimg{flex:none;width:64px;height:64px;border-radius:12px;border:2px solid var(--ink);object-fit:cover;background:#ffe27a;display:flex;align-items:center;justify-content:center;font-size:1.6rem}
.cinfo{flex:1;min-width:0}
.cname{font-weight:700;overflow-wrap:anywhere}
.cprice{font-size:.85rem;color:var(--mut)}
.cprice b{color:var(--ink)}
.step{display:flex;align-items:center;gap:8px;margin-top:6px}
.step button{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-weight:700;font-size:1.1rem;line-height:1;padding:0;cursor:pointer;color:var(--ink)}
.step span{min-width:24px;text-align:center;font-weight:700}
.step .rm{width:auto;border-radius:999px;padding:0 12px;font-size:.8rem;color:#d3123f;margin-left:auto}
.sum{background:#fff6cf;border:2.5px solid var(--ink);border-radius:16px;padding:10px 14px;margin:14px 0 4px}
.sum div{display:flex;justify-content:space-between;gap:8px}
.sum .tot{font-family:Fredoka,"Plus Jakarta Sans",sans-serif;font-weight:700;font-size:1.25rem;color:var(--pk);border-top:2px dashed var(--ink);margin-top:6px;padding-top:6px}
.struk{background:#fff;border:2px dashed var(--ink);border-radius:12px;padding:14px;margin:12px 0;font:14px/1.45 "Courier New",Courier,monospace;white-space:pre-wrap;overflow-x:auto;color:#111}
.col{display:flex;flex-direction:column;gap:2px}
footer{text-align:center;color:var(--mut);font-size:.82rem;font-weight:600;padding:28px 0 10px}
footer a{color:var(--mut);cursor:pointer;text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>
<dialog id="dlg"></dialog>
<dialog id="lb"></dialog>
<dialog id="cd"></dialog>
<div id="cartbar"></div>
<div id="toast" role="status"></div>
<script src="config.js"></script>
<script>
const C = window.NHOST_CONFIG;
const svc = s => `https://${C.subdomain}.${s}.${C.region}.nhost.run/v1`;
const AUTH = svc('auth'), GQL = svc('graphql'), STO = svc('storage');

let store = { name: 'Toko Kami', tagline: '', wa: '' };
let products = [];
let sess = JSON.parse(localStorage.getItem('nh_sess') || 'null');
let admin = false, q = '', cat = 'Semua', loadErr = '';

const $ = s => document.querySelector(s);
function el(t, a, ...k) {
  const e = document.createElement(t);
  for (const x in (a || {})) {
    if (x === 'class') e.className = a[x];
    else if (x.startsWith('on')) e.addEventListener(x.slice(2), a[x]);
    else e.setAttribute(x, a[x]);
  }
  k.flat().filter(c => c !== null && c !== undefined && c !== false).forEach(c => e.append(c));
  return e;
}
const rp = n => 'Rp' + Number(n || 0).toLocaleString('id-ID');
const waNum = v => { let n = String(v || '').replace(/\D/g, ''); if (n.startsWith('0')) n = '62' + n.slice(1); return n; };
const imgUrl = id => id ? `${STO}/files/${id}` : '';
const imgs = p => (Array.isArray(p.image_ids) && p.image_ids.length) ? p.image_ids : (p.image_id ? [p.image_id] : []);
function addSwipe(node, onLeft, onRight) {
  let x0 = null, y0 = null;
  node.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  node.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5) (dx < 0 ? onLeft : onRight)();
  }, { passive: true });
}

/* ---------- Nhost: auth, graphql, storage (REST murni, tanpa library) ---------- */
function setSess(s) { sess = s; s ? localStorage.setItem('nh_sess', JSON.stringify(s)) : localStorage.removeItem('nh_sess'); }
const mkSess = s => ({ accessToken: s.accessToken, refreshToken: s.refreshToken, exp: Date.now() + s.accessTokenExpiresIn * 1000 });

async function token() {
  if (!sess) return null;
  if (Date.now() > sess.exp - 30000) {
    const r = await fetch(AUTH + '/token', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ refreshToken: sess.refreshToken }) });
    if (!r.ok) { setSess(null); admin = false; return null; }
    setSess(mkSess(await r.json()));
  }
  return sess.accessToken;
}
async function login(email, password) {
  const r = await fetch(AUTH + '/signin/email-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
  const j = await r.json();
  if (!r.ok || !j.session) throw new Error(j.message || 'Email atau password salah');
  setSess(mkSess(j.session));
}
async function gql(query, variables) {
  const t = await token();
  const h = { 'Content-Type': 'application/json' };
  if (t) h.Authorization = 'Bearer ' + t;
  const r = await fetch(GQL, { method: 'POST', headers: h, body: JSON.stringify({ query, variables }) });
  const j = await r.json();
  if (j.errors) throw new Error(j.errors[0].message);
  return j.data;
}
async function upload(blob) {
  const t = await token();
  const fd = new FormData(); fd.append('file[]', blob, 'produk.jpg');
  const r = await fetch(STO + '/files', { method: 'POST', headers: { Authorization: 'Bearer ' + t }, body: fd });
  const j = await r.json();
  if (!r.ok) throw new Error((j.error && j.error.message) || 'Upload foto gagal');
  return j.processedFiles[0].id;
}
async function removeFile(id) {
  if (!id) return;
  const t = await token();
  try { await fetch(`${STO}/files/${id}`, { method: 'DELETE', headers: { Authorization: 'Bearer ' + t } }); } catch (e) {}
}

async function load() {
  try {
    const d = await gql(`query{store_settings_by_pk(id:1){name tagline wa} products(order_by:{created_at:desc}){id name price category description image_id image_ids in_stock}}`);
    if (d.store_settings_by_pk) store = d.store_settings_by_pk;
    products = d.products; loadErr = ''; syncCart();
  } catch (e) { loadErr = e.message; }
  render();
}

/* ---------- Tampilan ---------- */
function render() {
  document.title = store.name;
  const app = $('#app'); app.replaceChildren();
  app.append(el('header', { class: 'hero' }, el('h1', {}, store.name), el('p', { class: 'tag' }, store.tagline),
    el('div', { class: 'search' }, el('input', { type: 'search', placeholder: 'Cari produk…', 'aria-label': 'Cari produk', value: q, oninput: e => { q = e.target.value; list(); } }))));

  if (sess) app.append(el('div', { class: 'adm' },
    el('strong', {}, 'Admin'),
    el('button', { class: 'btn sec', onclick: () => { admin = !admin; render(); } }, admin ? 'Tutup mode edit' : 'Buka mode edit'),
    admin && el('button', { class: 'btn pri', onclick: () => editProduct() }, '+ Tambah produk'),
    admin && el('button', { class: 'btn sec', onclick: editStore }, 'Pengaturan toko'),
    el('button', { class: 'btn del', onclick: () => { setSess(null); admin = false; render(); } }, 'Keluar')
  ));

  const cats = ['Semua', ...new Set(products.map(p => p.category).filter(Boolean))];
  app.append(el('div', { class: 'chips' }, cats.map(c => el('button', { class: 'chip' + (c === cat ? ' on' : ''), onclick: () => { cat = c; render(); } }, c))));
  app.append(el('div', { id: 'list' }));
  app.append(el('footer', {}, '© ' + store.name + ' · ', sess ? '' : el('a', { onclick: loginDlg }, 'Admin')));
  list();
}

function list() {
  const box = $('#list'); if (!box) return;
  if (loadErr) { box.replaceChildren(el('div', { class: 'err' }, 'Gagal memuat katalog: ' + loadErr)); return; }
  const s = q.trim().toLowerCase();
  const items = products.filter(p => (cat === 'Semua' || p.category === cat) && (!s || (p.name + ' ' + p.description + ' ' + p.category).toLowerCase().includes(s)));
  box.replaceChildren(items.length ? el('div', { class: 'grid' }, items.map(card)) : el('div', { class: 'empty' }, 'Belum ada produk.'));
}

const cartIcon = () => { const t = document.createElement('template'); t.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1.003 1.003 0 0 0 20 4H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>'; return t.content.firstChild; };

function card(p) {
  const ids = imgs(p);
  let i = 0;
  const img = ids.length ? el('img', { src: imgUrl(ids[0]), alt: p.name, loading: 'lazy' }) : null;
  const cnt = el('span', { class: 'cnt' }, '1/' + ids.length);
  const go = d => { i = (i + d + ids.length) % ids.length; img.src = imgUrl(ids[i]); cnt.textContent = (i + 1) + '/' + ids.length; };
  const arrow = (d, c, t) => el('button', { class: 'arr ' + c, type: 'button', 'aria-label': t, onclick: e => { e.stopPropagation(); go(d); } }, d < 0 ? '‹' : '›');
  const pic = el('div', { class: 'pic' + (ids.length ? '' : ' noimg') },
    el('button', { class: 'pbtn', type: 'button', 'aria-label': ids.length ? 'Perbesar foto ' + p.name : p.name, onclick: () => showImages(p, i) },
      img || '🛍️',
      !p.in_stock && el('span', { class: 'sold' }, 'Stok habis'),
      ids.length > 0 && el('span', { class: 'zoom' }, 'Perbesar')),
    ids.length > 1 && arrow(-1, 'l', 'Foto sebelumnya'),
    ids.length > 1 && arrow(1, 'r', 'Foto berikutnya'),
    ids.length > 1 && cnt);
  if (ids.length > 1) addSwipe(pic, () => go(1), () => go(-1));
  return el('div', { class: 'card' + (p.in_stock ? '' : ' out') },
    pic,
    el('div', { class: 'info' },
      el('div', { class: 'name' }, p.name),
      el('div', { class: 'meta' },
        el('span', { class: 'price' }, rp(p.price)),
        p.in_stock ? el('button', { class: 'wa', type: 'button', title: 'Tambah ke keranjang', 'aria-label': 'Tambah ' + p.name + ' ke keranjang', onclick: () => addToCart(p) }, cartIcon(), el('span', { class: 'qb', 'data-pid': p.id }, qtyOf(p.id) || '+'))
                   : el('span', { class: 'wa off', 'aria-label': 'Stok habis' }, cartIcon()))),
    admin && el('div', { class: 'admrow' },
      el('button', { class: 'btn sec', onclick: () => editProduct(p) }, 'Edit'),
      el('button', { class: 'btn del', onclick: () => delProduct(p) }, 'Hapus')));
}

function showImages(p, start) {
  const ids = imgs(p); if (!ids.length) return;
  const lb = $('#lb');
  let i = start || 0;
  const img = el('img', { alt: p.name, draggable: 'false' });
  const cnt = el('div', { class: 'lbcnt' });
  const dots = el('div', { class: 'lbdots' }, ids.length > 1 && ids.map(() => el('span', { class: 'dot' })));
  const draw = () => {
    img.src = imgUrl(ids[i]); cnt.textContent = (i + 1) + ' / ' + ids.length;
    [...dots.children].forEach((d, k) => d.classList.toggle('on', k === i));
  };
  const go = d => { i = (i + d + ids.length) % ids.length; draw(); };
  const nav = (d, c, t) => el('button', { class: 'lbnav ' + c, type: 'button', 'aria-label': t, onclick: e => { e.stopPropagation(); go(d); } }, d < 0 ? '‹' : '›');
  const wrap = el('div', { class: 'lbwrap' }, img);
  const many = ids.length > 1;
  lb.replaceChildren(wrap,
    el('button', { class: 'lbx', type: 'button', 'aria-label': 'Tutup foto', onclick: () => lb.close() }, '✕'),
    many && nav(-1, 'l', 'Foto sebelumnya'), many && nav(1, 'r', 'Foto berikutnya'), many && cnt, many && dots);
  if (many) { addSwipe(wrap, () => go(1), () => go(-1)); ids.forEach(id => { new Image().src = imgUrl(id); }); }
  lb._go = go;
  draw();
  lb.showModal();
}

/* ---------- Keranjang belanja (tersimpan di browser pelanggan) ---------- */
let cart = { items: [], cust: { name: '', wa: '', addr: '', note: '' } };
try {
  const c = JSON.parse(localStorage.getItem('nh_cart') || 'null');
  if (c && Array.isArray(c.items)) cart = { items: c.items, cust: { ...cart.cust, ...(c.cust || {}) } };
} catch (e) {}
let orderNo = null, orderAt = '', toastT;
const saveCart = () => { try { localStorage.setItem('nh_cart', JSON.stringify(cart)); } catch (e) {} };
const qtyOf = id => { const it = cart.items.find(i => i.id === id); return it ? it.qty : 0; };
const totalQty = () => cart.items.reduce((a, i) => a + i.qty, 0);
const totalVal = () => cart.items.reduce((a, i) => a + i.qty * i.price, 0);
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1900); }
function updateBadges() { document.querySelectorAll('.qb[data-pid]').forEach(b => { b.textContent = qtyOf(b.dataset.pid) || '+'; }); }
function renderBar() {
  const b = $('#cartbar'), n = totalQty();
  if (!n) { b.replaceChildren(); b.style.display = 'none'; return; }
  b.style.display = 'flex';
  b.replaceChildren(el('button', { class: 'cbtn', type: 'button', onclick: openCart },
    el('span', {}, '🛒 Keranjang'), el('span', { class: 'cb2' }, n + ' barang · ' + rp(totalVal())), el('span', {}, 'Lihat ›')));
}
function cartChanged() { orderNo = null; saveCart(); updateBadges(); renderBar(); }
function addToCart(p) {
  if (!p.in_stock) return;
  const it = cart.items.find(i => i.id === p.id);
  if (it) { if (it.qty >= 99) { toast('Maksimal 99 per barang'); return; } it.qty++; }
  else cart.items.push({ id: p.id, name: p.name, price: p.price, qty: 1, img: imgs(p)[0] || null });
  cartChanged(); toast(p.name + ' masuk keranjang');
}
function syncCart() {
  const before = cart.items.length;
  cart.items = cart.items.filter(i => {
    const p = products.find(x => x.id === i.id);
    if (!p || !p.in_stock) return false;
    i.name = p.name; i.price = p.price; i.img = imgs(p)[0] || null; return true;
  });
  if (cart.items.length < before) toast('Sebagian barang dihapus karena sudah tidak tersedia');
  cartChanged();
}

function openCart() { orderNo = null; drawCart(); $('#cd').showModal(); }

function drawCart() {
  const cd = $('#cd');
  cd.scrollTop = 0;
  if (!cart.items.length) {
    cd.replaceChildren(el('h2', {}, 'Keranjang belanja'), el('div', { class: 'empty' }, 'Keranjang masih kosong.'),
      el('div', { class: 'row' }, el('button', { class: 'btn pri', onclick: () => cd.close() }, 'Mulai belanja')));
    return;
  }
  const chg = (it, d) => { it.qty = Math.min(99, it.qty + d); if (it.qty < 1) cart.items = cart.items.filter(x => x !== it); cartChanged(); drawCart(); };
  const rows = cart.items.map(it => el('div', { class: 'crow' },
    it.img ? el('img', { class: 'cimg', src: imgUrl(it.img), alt: '' }) : el('div', { class: 'cimg' }, '🛍️'),
    el('div', { class: 'cinfo' },
      el('div', { class: 'cname' }, it.name),
      el('div', { class: 'cprice' }, rp(it.price) + ' × ' + it.qty + ' = ', el('b', {}, rp(it.price * it.qty))),
      el('div', { class: 'step' },
        el('button', { type: 'button', 'aria-label': 'Kurangi', onclick: () => chg(it, -1) }, '−'),
        el('span', {}, it.qty),
        el('button', { type: 'button', 'aria-label': 'Tambah', onclick: () => chg(it, 1) }, '+'),
        el('button', { type: 'button', class: 'rm', onclick: () => { cart.items = cart.items.filter(x => x !== it); cartChanged(); drawCart(); } }, 'Hapus')))));
  const bind = (node, key) => { node.addEventListener('input', () => { cart.cust[key] = node.value; saveCart(); }); return node; };
  const area = (key, ph) => { const t = el('textarea', { rows: 2, placeholder: ph }); t.value = cart.cust[key]; return bind(t, key); };
  cd.replaceChildren(
    el('h2', {}, 'Keranjang belanja'),
    ...rows,
    el('div', { class: 'sum' },
      el('div', {}, el('span', {}, 'Jenis barang'), el('b', {}, String(cart.items.length))),
      el('div', {}, el('span', {}, 'Total qty'), el('b', {}, totalQty() + ' pcs')),
      el('div', { class: 'tot' }, el('span', {}, 'Total nilai'), el('span', {}, rp(totalVal())))),
    el('h2', { style: 'margin-top:16px' }, 'Data pemesan'),
    field('Nama pemesan *', bind(el('input', { value: cart.cust.name, placeholder: 'Nama lengkap', autocomplete: 'name' }), 'name')),
    field('No. WhatsApp pemesan', bind(el('input', { value: cart.cust.wa, placeholder: '08123456789', inputmode: 'tel', autocomplete: 'tel' }), 'wa')),
    field('Alamat pengiriman', area('addr', 'Alamat lengkap penerima')),
    field('Catatan untuk penjual', area('note', 'Contoh: warna, ukuran, atau permintaan lain')),
    el('div', { class: 'row', style: 'margin-top:16px' },
      el('button', { class: 'btn sec', onclick: () => cd.close() }, 'Lanjut belanja'),
      el('button', { class: 'btn pri', onclick: () => { if (!cart.cust.name.trim()) { alert('Isi nama pemesan terlebih dahulu.'); return; } drawReceipt(); } }, 'Buat struk')));
}

/*RCPT-START*/
const RW = 34;
const rcenter = t => ' '.repeat(Math.max(0, Math.floor((RW - t.length) / 2))) + t;
const rhr = () => '-'.repeat(RW);
function rtwo(l, r) { const sp = RW - l.length - r.length; return sp >= 1 ? [l + ' '.repeat(sp) + r] : [l, ' '.repeat(Math.max(0, RW - r.length)) + r]; }
function rwrap(text, first, rest) {
  const out = []; let pre = first, line = '';
  const room = () => RW - pre.length;
  const flush = () => { out.push(pre + line); pre = rest; line = ''; };
  for (const para of String(text).split('\n')) {
    for (let word of para.split(/\s+/).filter(Boolean)) {
      while (word.length > room()) {
        if (line) flush();
        const cut = room();
        out.push(pre + word.slice(0, cut)); pre = rest; word = word.slice(cut);
      }
      if (line && (line + ' ' + word).length > room()) flush();
      line = line ? line + ' ' + word : word;
    }
    if (line) flush();
  }
  if (!out.length) out.push(first.trimEnd());
  return out;
}
function receiptLines(r) {
  const L = [];
  rwrap(r.store.toUpperCase(), '', '').forEach(x => L.push(rcenter(x)));
  const head = L.length + 1;
  L.push(rcenter('RESI PERSIAPAN BARANG'));
  L.push(rhr());
  const kv = (k, v) => { if (String(v || '').trim()) rwrap(v, (k + '       ').slice(0, 7) + ': ', ' '.repeat(9)).forEach(x => L.push(x)); };
  kv('No', r.no); kv('Tanggal', r.at); kv('Pemesan', r.c.name); kv('No. WA', r.c.wa); kv('Alamat', r.c.addr);
  L.push(rhr());
  r.items.forEach((it, k) => {
    const n = (k + 1) + '. ';
    const ind = ' '.repeat(4 + n.length);
    rwrap(it.name, '[ ] ' + n, ind).forEach(x => L.push(x));
    L.push(...rtwo(ind + it.qty + ' x ' + r.rp(it.price), r.rp(it.qty * it.price)));
  });
  L.push(rhr());
  L.push(...rtwo('Jenis barang', String(r.items.length)));
  L.push(...rtwo('Total qty', r.qty + ' pcs'));
  L.push(...rtwo('TOTAL NILAI', r.rp(r.val)));
  L.push(rhr());
  if (String(r.c.note || '').trim()) { rwrap(r.c.note, 'Catatan: ', ' '.repeat(9)).forEach(x => L.push(x)); L.push(rhr()); }
  rwrap('Mohon konfirmasi ketersediaan barang dan ongkos kirim.', '', '').forEach(x => L.push(rcenter(x)));
  L.push(rcenter('Terima kasih'));
  L.head = head;
  return L;
}
/*RCPT-END*/

function genNo() {
  const d = new Date(), z = n => String(n).padStart(2, '0');
  return 'ORD-' + String(d.getFullYear()).slice(2) + z(d.getMonth() + 1) + z(d.getDate()) + '-' + Math.floor(100 + Math.random() * 900);
}

function drawReceipt() {
  const cd = $('#cd');
  if (!orderNo) { orderNo = genNo(); orderAt = new Date().toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }); }
  const lines = receiptLines({ store: store.name, no: orderNo, at: orderAt, c: cart.cust, items: cart.items, qty: totalQty(), val: totalVal(), rp });
  const text = lines.join('\n');
  const copyBtn = el('button', { class: 'btn sec', onclick: async () => {
    try { await navigator.clipboard.writeText(text); copyBtn.textContent = 'Tersalin ✓'; } catch (e) { copyBtn.textContent = 'Gagal menyalin'; }
    setTimeout(() => { copyBtn.textContent = 'Salin teks struk'; }, 1800);
  } }, 'Salin teks struk');
  cd.scrollTop = 0;
  cd.replaceChildren(
    el('h2', {}, 'Struk pesanan'),
    el('div', { class: 'hint' }, 'Periksa struk di bawah, lalu kirim ke penjual sebagai resi persiapan barang.'),
    el('pre', { class: 'struk' }, text),
    el('div', { class: 'col' },
      el('button', { class: 'btn', onclick: () => sendWA(text) }, 'Kirim ke penjual via WhatsApp'),
      el('button', { class: 'btn sec', onclick: () => saveImg(lines, orderNo) }, 'Simpan / bagikan gambar struk'),
      copyBtn,
      el('div', { class: 'row' },
        el('button', { class: 'btn sec', onclick: drawCart }, '‹ Ubah pesanan'),
        el('button', { class: 'btn del', onclick: () => { if (confirm('Kosongkan keranjang?')) { cart.items = []; cartChanged(); cd.close(); } } }, 'Kosongkan'))));
}

function sendWA(text) {
  const n = waNum(store.wa);
  if (!n) { alert('Nomor WhatsApp penjual belum diatur.'); return; }
  const msg = 'Halo ' + store.name + ', berikut struk pesanan saya:\n\n```' + text + '```';
  window.open('https://wa.me/' + n + '?text=' + encodeURIComponent(msg), '_blank', 'noopener');
}

async function saveImg(lines, no) {
  const fs = 22, lh = 32, pad = 30, mono = '"Courier New",Courier,monospace';
  const m = document.createElement('canvas').getContext('2d'); m.font = fs + 'px ' + mono;
  const cw = m.measureText('M').width, sc = 2;
  const w = Math.ceil(cw * RW) + pad * 2, h = lines.length * lh + pad * 2;
  const cv = document.createElement('canvas'); cv.width = w * sc; cv.height = h * sc;
  const ctx = cv.getContext('2d'); ctx.scale(sc, sc);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#111'; ctx.textBaseline = 'top';
  lines.forEach((t, i) => { ctx.font = (i < lines.head ? 'bold ' : '') + fs + 'px ' + mono; ctx.fillText(t, pad, pad + i * lh + 3); });
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  const file = new File([blob], 'struk-' + no + '.png', { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'Struk pesanan ' + no }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

const field = (l, n) => { const f = document.createDocumentFragment(); f.append(el('label', {}, l), n); return f; };
const busy = (b, on) => { b.disabled = on; b.style.opacity = on ? .6 : 1; };

function loginDlg() {
  const em = el('input', { type: 'email', placeholder: 'email@contoh.com', autocomplete: 'username' });
  const pw = el('input', { type: 'password', autocomplete: 'current-password' });
  const dlg = $('#dlg');
  const go = el('button', { class: 'btn pri', onclick: async () => {
    busy(go, true);
    try { await login(em.value.trim(), pw.value); dlg.close(); admin = true; await load(); }
    catch (e) { alert(e.message); busy(go, false); }
  } }, 'Masuk');
  dlg.replaceChildren(el('h2', {}, 'Masuk admin'), field('Email', em), field('Password', pw),
    el('div', { class: 'row', style: 'margin-top:16px' }, el('button', { class: 'btn sec', onclick: () => dlg.close() }, 'Batal'), go));
  dlg.showModal();
}

function editProduct(p) {
  const isNew = !p;
  const d = p ? { ...p } : { name: '', price: '', category: cat !== 'Semua' ? cat : '', description: '', in_stock: true };
  const orig = p ? imgs(p) : [];
  const items = orig.map(id => ({ id, url: imgUrl(id) }));
  const name = el('input', { value: d.name, placeholder: 'Nama produk' });
  const price = el('input', { type: 'number', inputmode: 'numeric', value: d.price, placeholder: '75000' });
  const c = el('input', { value: d.category, placeholder: 'Contoh: Fashion', list: 'cats' });
  const dl = el('datalist', { id: 'cats' }, [...new Set(products.map(x => x.category).filter(Boolean))].map(x => el('option', { value: x })));
  const desc = el('textarea', { rows: 3, placeholder: 'Deskripsi singkat' }); desc.value = d.description;
  const stock = el('select', {}, el('option', { value: '1' }, 'Tersedia'), el('option', { value: '0' }, 'Stok habis')); stock.value = d.in_stock ? '1' : '0';
  const thumbs = el('div', { class: 'thumbs' });
  const drawThumbs = () => {
    thumbs.replaceChildren(...items.map((it, k) => el('div', { class: 'th' },
      el('img', { src: it.url, alt: '' }),
      k === 0 && el('span', { class: 'main' }, 'Utama'),
      el('div', { class: 'thb' },
        k > 0 && el('button', { type: 'button', title: 'Jadikan foto utama', onclick: () => { items.unshift(items.splice(k, 1)[0]); drawThumbs(); } }, '★'),
        el('button', { type: 'button', title: 'Hapus foto', onclick: () => { items.splice(k, 1); drawThumbs(); } }, '✕')))));
  };
  const file = el('input', { type: 'file', accept: 'image/*', multiple: '', onchange: async e => {
    const fs = [...e.target.files]; e.target.value = '';
    for (const f of fs) {
      if (items.length >= 8) { alert('Maksimal 8 foto per produk.'); break; }
      const blob = await shrink(f); items.push({ blob, url: URL.createObjectURL(blob) });
    }
    drawThumbs();
  } });
  drawThumbs();
  const dlg = $('#dlg');
  const save = el('button', { class: 'btn pri', onclick: async () => {
    if (!name.value.trim()) { alert('Nama produk wajib diisi.'); return; }
    busy(save, true);
    try {
      const finalIds = [];
      for (const it of items) finalIds.push(it.id || await upload(it.blob));
      const obj = { name: name.value.trim(), price: Number(price.value) || 0, category: c.value.trim(), description: desc.value.trim(), in_stock: stock.value === '1', image_ids: finalIds, image_id: finalIds[0] || null };
      if (isNew) await gql(`mutation($o:products_insert_input!){insert_products_one(object:$o){id}}`, { o: obj });
      else await gql(`mutation($id:uuid!,$s:products_set_input!){update_products_by_pk(pk_columns:{id:$id},_set:$s){id}}`, { id: p.id, s: obj });
      for (const id of orig) if (!finalIds.includes(id)) await removeFile(id);
      dlg.close(); await load();
    } catch (e) { alert('Gagal menyimpan: ' + e.message); busy(save, false); }
  } }, 'Simpan produk');
  dlg.replaceChildren(el('h2', {}, isNew ? 'Tambah produk' : 'Edit produk'),
    field('Nama', name), field('Harga (Rp)', price), field('Kategori', c), dl, field('Deskripsi', desc), field('Stok', stock),
    field('Foto produk (boleh lebih dari satu)', file), thumbs,
    el('div', { class: 'hint' }, 'Foto pertama jadi foto utama. Tekan ★ untuk menjadikannya foto utama, ✕ untuk menghapus.'),
    el('div', { class: 'row', style: 'margin-top:16px' }, el('button', { class: 'btn sec', onclick: () => dlg.close() }, 'Batal'), save));
  dlg.showModal();
}

async function delProduct(p) {
  if (!confirm('Hapus produk "' + p.name + '"?')) return;
  try {
    await gql(`mutation($id:uuid!){delete_products_by_pk(id:$id){id}}`, { id: p.id });
    for (const id of imgs(p)) await removeFile(id);
    await load();
  } catch (e) { alert('Gagal menghapus: ' + e.message); }
}

function editStore() {
  const n = el('input', { value: store.name });
  const t = el('input', { value: store.tagline });
  const w = el('input', { value: store.wa, placeholder: '08123456789', inputmode: 'tel' });
  const dlg = $('#dlg');
  const save = el('button', { class: 'btn pri', onclick: async () => {
    busy(save, true);
    try {
      await gql(`mutation($s:store_settings_set_input!){update_store_settings_by_pk(pk_columns:{id:1},_set:$s){id}}`, { s: { name: n.value.trim() || 'Toko Kami', tagline: t.value.trim(), wa: waNum(w.value) } });
      dlg.close(); await load();
    } catch (e) { alert('Gagal menyimpan: ' + e.message); busy(save, false); }
  } }, 'Simpan');
  dlg.replaceChildren(el('h2', {}, 'Pengaturan toko'), field('Nama toko', n), field('Slogan', t), field('Nomor WhatsApp pesanan', w),
    el('div', { class: 'row', style: 'margin-top:16px' }, el('button', { class: 'btn sec', onclick: () => dlg.close() }, 'Batal'), save));
  dlg.showModal();
}

function shrink(file) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const k = Math.min(1, 900 / Math.max(im.width, im.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
        cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
        cv.toBlob(b => res(b), 'image/jpeg', 0.8);
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

$('#lb').addEventListener('click', e => { const lb = $('#lb'); if (e.target === lb || e.target.classList.contains('lbwrap')) lb.close(); });
document.addEventListener('keydown', e => { const lb = $('#lb'); if (!lb.open || !lb._go) return; if (e.key === 'ArrowLeft') lb._go(-1); if (e.key === 'ArrowRight') lb._go(1); });
render();
load();
